services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: ai_mtt
      POSTGRES_USER: ai_mtt
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_mtt -d ai_mtt"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
