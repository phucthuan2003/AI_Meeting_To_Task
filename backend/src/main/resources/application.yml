spring:
  application:
    name: ai-meeting-to-task
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_mtt}
    username: ${DATABASE_USER:ai_mtt}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  llm:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini-2025-04-14}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
    request-timeout: 60s
    max-input-bytes: 49152
    max-output-tokens: 4096
  chunking:
    enabled: ${CHUNKING_ENABLED:false}
    input-bytes: ${CHUNK_INPUT_BYTES:24000}
    overlap-segments: 2
    max-chunks: 20
    known-tasks-bytes: 4096
  retention:
    enabled: ${RETENTION_ENABLED:true}
    poll-delay-ms: 600000
    grace: 24h
    log-retention: ${LOG_RETENTION_DAYS:90}d
    session-retention: 7d
  analysis:
    worker-enabled: ${ANALYSIS_WORKER_ENABLED:true}
    poll-delay-ms: 1000
    lease-duration: 30s
    max-attempts: 3
    max-manual-retries: 3
    max-active-per-user: 2
    preparation-batch-size: 100
    context-tokens: 131072
    reserved-tokens: 8192
  trello:
    client-id: ${TRELLO_CLIENT_ID:}
    client-secret: ${TRELLO_CLIENT_SECRET:}
    callback-url: ${TRELLO_CALLBACK_URL:}
    scopes: ${TRELLO_SCOPES:read:member:trello read:board:trello write:board:trello offline_access}
    authorize-url: ${TRELLO_AUTHORIZE_URL:https://auth.atlassian.com/authorize}
    token-url: ${TRELLO_TOKEN_URL:https://auth.atlassian.com/oauth/token}
    api-base-url: ${TRELLO_API_BASE_URL:https://api.trello.com/1}
    api-key: ${TRELLO_API_KEY:}
    app-name: AI Meeting to Task
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
    key-version: ${TOKEN_KEY_VERSION:1}
    request-timeout: ${TRELLO_TIMEOUT:20s}
    transaction-ttl: 10m
    allow-local-http: ${TRELLO_ALLOW_LOCAL_HTTP:false}
    card-url-hosts: trello.com
  sync:
    worker-enabled: ${SYNC_WORKER_ENABLED:true}
    poll-delay-ms: 1000
    lease-duration: ${JOB_LEASE_SECONDS:60}s
    max-transient-attempts: 4
    retry-base-delay: 2s
    reconcile-delay: 30s
    max-auto-reconcile: 3
    reconcile-pages: 5
  auth:
    jwt-secret: ${JWT_SIGNING_KEY:}
    issuer: ai-meeting-to-task
    audience: ai-mtt-extension
    access-token-ttl: 15m
  cors-origins: ${EXTENSION_ORIGIN_ALLOWLIST:}
  input:
    max-json-bytes: 1048576
    max-upload-bytes: 10485760
    max-extracted-chars: 200000
    max-zip-entry-bytes: 20971520
    max-zip-total-bytes: 52428800
    max-zip-entries: 1000
    min-inflate-ratio: 0.01
    source-retention: 30d
