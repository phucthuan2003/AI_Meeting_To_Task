spring:
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: ai-meeting-to-task
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_mtt}
    username: ${DATABASE_USER:ai_mtt}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Analysis workers, capture/sync workers and API requests share this pool; connections are held only briefly.
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  audio:
    api-key: ${GROQ_API_KEY:}
    model: ${STT_MODEL:whisper-large-v3-turbo}
    intelligence-url: ${INTELLIGENCE_STT_URL:}
    intelligence-api-key: ${INTELLIGENCE_API_KEY:}
    worker-enabled: ${AUDIO_WORKER_ENABLED:true}
  llm:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini-2025-04-14}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
    request-timeout: ${LLM_REQUEST_TIMEOUT:20s}
    max-input-bytes: 49152
    max-output-tokens: 4096
    tuning:
      # JSON mode (responseJsonSchema) for Gemini; a model that rejects it falls back to text mode once and is remembered.
      gemini-structured-output: ${GEMINI_STRUCTURED_OUTPUT:true}
      # Blank = model default. Gemini 3.x accepts minimal|low|medium|high; thinking tokens count against max-output-tokens.
      gemini-thinking-level: ${GEMINI_THINKING_LEVEL:}
      # In-flight requests per provider (shared API key) for this instance; extra jobs wait instead of hitting HTTP 429.
      max-concurrent-requests: ${LLM_MAX_CONCURRENT:4}
      max-queue-wait: 120s
      # Client-side budget per provider for this instance; set to the API key's quota (0 = off). Requests wait for
      # budget instead of being rejected with 429. After a 429 the provider is paused for its retry delay.
      requests-per-minute: ${LLM_RPM:0}
      tokens-per-minute: ${LLM_TPM:0}
      rate-limit-cooldown: 20s
  chunking:
    enabled: ${CHUNKING_ENABLED:false}
    # Each part is one provider request: large, evenly sized parts = fewer requests per transcript (rate limit).
    # Segments are sent compactly ({seq,text}), so 40 KB holds far more transcript than before.
    input-bytes: ${CHUNK_INPUT_BYTES:40000}
    overlap-segments: ${CHUNK_OVERLAP_SEGMENTS:1}
    max-chunks: 20
    known-tasks-bytes: 4096
  retention:
    enabled: ${RETENTION_ENABLED:true}
    poll-delay-ms: 600000
    grace: 24h
    log-retention: ${LOG_RETENTION_DAYS:90}d
    session-retention: 7d
  analysis:
    worker-enabled: ${ANALYSIS_WORKER_ENABLED:true}
    poll-delay-ms: 1000
    lease-duration: 30s
    max-attempts: 3
    max-manual-retries: 3
    max-active-per-user: 2
    preparation-batch-size: 100
    context-tokens: 131072
    reserved-tokens: 8192
    workers:
      # Analysis jobs processed at the same time by this instance (was 1).
      concurrency: ${ANALYSIS_CONCURRENCY:4}
      # Transient provider errors are requeued with exponential backoff while attempts remain (max-attempts).
      auto-retry: ${ANALYSIS_AUTO_RETRY:true}
      retry-base-delay: 5s
      retry-max-delay: 60s
  trello:
    client-id: ${TRELLO_CLIENT_ID:}
    client-secret: ${TRELLO_CLIENT_SECRET:}
    callback-url: ${TRELLO_CALLBACK_URL:}
    scopes: ${TRELLO_SCOPES:read:member:trello read:board:trello write:board:trello offline_access}
    authorize-url: ${TRELLO_AUTHORIZE_URL:https://auth.atlassian.com/authorize}
    token-url: ${TRELLO_TOKEN_URL:https://auth.atlassian.com/oauth/token}
    api-base-url: ${TRELLO_API_BASE_URL:https://api.trello.com/1}
    api-key: ${TRELLO_API_KEY:}
    app-name: AI Meeting to Task
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
    key-version: ${TOKEN_KEY_VERSION:1}
    request-timeout: ${TRELLO_TIMEOUT:20s}
    transaction-ttl: 10m
    allow-local-http: ${TRELLO_ALLOW_LOCAL_HTTP:false}
    card-url-hosts: trello.com
  sync:
    worker-enabled: ${SYNC_WORKER_ENABLED:true}
    poll-delay-ms: 1000
    lease-duration: ${JOB_LEASE_SECONDS:60}s
    max-transient-attempts: 4
    retry-base-delay: 2s
    reconcile-delay: 30s
    max-auto-reconcile: 3
    reconcile-pages: 5
  auth:
    jwt-secret: ${JWT_SIGNING_KEY:}
    issuer: ai-meeting-to-task
    audience: ai-mtt-extension
    access-token-ttl: 15m
  cors-origins: ${EXTENSION_ORIGIN_ALLOWLIST:}
  input:
    max-json-bytes: 1048576
    max-upload-bytes: 10485760
    max-extracted-chars: 200000
    max-zip-entry-bytes: 20971520
    max-zip-total-bytes: 52428800
    max-zip-entries: 1000
    min-inflate-ratio: 0.01
    source-retention: 30d
